[package]
name = "tasks"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
base64 = "0.23.0"
chrono = "0.4.45"
clap = { version = "4.6.4", features = ["env"] }
futures = "0.3.33"
hex = "0.4.3"
humansize = "2.1.3"
jiff = "0.2.37"
jsonc-parser = { version = "0.33.2", features = ["cst", "serde"] }
mime_guess = "2.0.5"
reqwest = { version = "0.13.4", features = ["json", "multipart"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.11.0"
thiserror = "2.0.19"
tokio = { version = "1.53.1", features = ["full"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
walkdir = "2.5.0"
